# Netlify build + functions config.
# Frontend is a static file in publish/; the API is TypeScript functions that
# Netlify bundles to Node lambdas. Each function declares its own /api/* route
# via `export const config = { path }`, so no redirects are needed for them.

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  # esbuild bundles the shared netlify/lib/*.ts into each function.
  node_bundler = "esbuild"

# SPA-ish fallback: anything that isn't a function or a real file serves the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
